<style>
* {

body {

}

.container {

}

.form-section {

}

.form-section h2 {

    color: #1a2c3e;
}

input, textarea {

    margin-top: 5px;
    margin-bottom: 12px;
    border: 1px solid #adb5bd;
    border-radius: 6px;
    font-size: 14px;
}

textarea {
    resize: vertical;
}

button {

    border: none;
    background: #1a2c3e;
    color: #fff;
    border-radius: 8px;
    font-weight: bold;

}

button:hover {
    background: #0f1b26;
}

.add-product {
    background: #2c3e50;
}

/* Invoice page - Using custom large size to fit everything */
.invoice-page {
    width: 240mm; /* Wider than A4 */
    min-height: 350mm; /* Taller than A4 */
    background: #fff;
    margin: auto;
    padding: 8mm 10mm; /* Slightly reduced padding */
    border: 2px solid #212529;
    page-break-after: always;
    box-sizing: border-box;
    position: relative;
    font-size: 11px; /* Slightly smaller base font */
}

.title {
    text-align: center;
    position: relative;
    margin-bottom: 8px;
}

.title h1 {
    margin: 0;
    font-size: 24px;
    letter-spacing: 1px;
}

.title h3 {
    margin: 2px 0;
    font-size: 12px;
    font-weight: normal;
}

.original {
    position: absolute;
    right: 0;
    top: 0;
    font-style: italic;
    font-size: 11px;
    font-weight: bold;
}

.top-grid {
    display: grid;
    grid-template-columns: 52% 48%;
    border: 1px solid #000;
    margin-top: 8px;
}

.left-box {
    border-right: 1px solid #000;
}

.company-box {
    padding: 6px 8px;
    border-bottom: 1px solid #000;
    line-height: 1.3;
    font-size: 10px;
}

.company-name {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 2px;
}

.meta-table {
    width: 100%;
    border-collapse: collapse;
    height: 100%;
}

.meta-table td {
    border: 1px solid #000;
    padding: 4px 6px;
    font-size: 10px;
    vertical-align: top;
    line-height: 1.3;
}

.meta-table b {
    font-size: 11px;
}

.section-title {
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 2px;
}

.bold {
    font-weight: bold;
}

.product-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
}

.product-table th,
.product-table td {
    border: 1px solid #000;
    padding: 4px 5px;
    font-size: 10px;
}

.product-table th {
    text-align: center;
    background: #f0f0f0;
    font-weight: bold;
    font-size: 10px;
}

.right {
    text-align: right;
}

.center {

}

.total-row td {

    background: #f8f8f8;
}

.amount-words {

    margin-top: 6px;
    font-size: 10px;
    line-height: 1.4;
}

.tax-table {

    margin-top: 6px;
}

.tax-table td,

    border: 1px solid #000;
    padding: 4px 5px;
    font-size: 10px;
}

.tax-table th {

.bottom-grid {

.bottom-box {

.bottom-box:last-child {

.footer {

// ========== NUMBER TO WORDS (Indian System) ==========
function numberToIndianWords(amount) {
    if (amount === 0 || isNaN(amount) || amount === null) return "Zero";
    let num = Math.round(amount);
    if (num === 0) return "Zero";
    
    const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", 
                  "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
    const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
    
    function convertLessThanThousand(n) {
        if (n === 0) return "";
        if (n < 20) return ones[n] + " ";
        if (n < 100) return tens[Math.floor(n / 10)] + " " + (n % 10 !== 0 ? ones[n % 10] + " " : "");
        return ones[Math.floor(n / 100)] + " Hundred " + (n % 100 !== 0 ? convertLessThanThousand(n % 100) : "");
    }
    
    let crore = Math.floor(num / 10000000);
    let lakh = Math.floor((num % 10000000) / 100000);
    let thousand = Math.floor((num % 100000) / 1000);
    let remainder = num % 1000;
    
    let words = "";
    if (crore > 0) words += convertLessThanThousand(crore) + "Crore ";
    if (lakh > 0) words += convertLessThanThousand(lakh) + "Lakh ";
    if (thousand > 0) words += convertLessThanThousand(thousand) + "Thousand ";
    if (remainder > 0) words += convertLessThanThousand(remainder);
    
    words = words.replace(/\s+/g, " ").trim();
    if (words === "") words = "Zero";
    
    let result = words.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' ');
    return result;
}

function formatCurrency(num) {
    return Number(num).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function downloadPDF() {
    const invoice = document.getElementById("invoice");
    if (!invoice) {
        alert("Please generate the invoice first!");
        return;
    }
    
    let now = new Date();
    let fileName = `Tax_Invoice_MEGHAN_CAPCO_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.pdf`;
    
    let opt = {
        margin: [5, 5, 5, 5], // Small margins to fit more content
        filename: fileName,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
            scale: 2, 
            letterRendering: true, 
            useCORS: false,
            scrollY: 0,
            windowWidth: invoice.scrollWidth,
            windowHeight: invoice.scrollHeight
        },
        jsPDF: { 
            unit: 'mm', 
            format: [240, 350], // Custom size: 240mm x 350mm (wider and taller than A4)
            orientation: 'portrait' 
        },
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };
    
    html2pdf().set(opt).from(invoice).save();
}
